<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Patient - MediFlow</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="dashboard">

    <header class="topbar">

        <div>

            <h1>🏥 MediFlow</h1>

            <p>
                Hospital Management System
            </p>

        </div>

        <button
            class="logout"
            type="button"
            onclick="location.href='dashboard.html'">

            Dashboard

        </button>

    </header>

    <main>

        <div class="add-patient-container">

            <h2>
                Add Patient
            </h2>

            <p>
                Register a new patient
            </p>

            <form onsubmit="addPatient(event); return false;">

                <label for="patientId">
                    Patient ID
                </label>

                <input
                    type="number"
                    id="patientId"
                    required
                >

                <label for="patientName">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    required
                >

                <label for="patientAge">
                    Age
                </label>

                <input
                    type="number"
                    id="patientAge"
                    min="1"
                    max="120"
                    required
                >

                <label for="patientGender">
                    Gender
                </label>

                <select
                    id="patientGender"
                    required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <label for="patientDisease">
                    Disease
                </label>

                <input
                    type="text"
                    id="patientDisease"
                    placeholder="Enter disease"
                    required
                >

                <label for="patientPhone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="patientPhone"
                    placeholder="10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="patientAddress">
                    Address
                </label>

                <textarea
                    id="patientAddress"
                    rows="3"
                    placeholder="Enter patient's address"
                    required
                ></textarea>

                <label for="patientMedicalHistory">
                    Previous Medical History
                </label>

                <textarea
                    id="patientMedicalHistory"
                    rows="4"
                    placeholder="Enter previous medical history"
                ></textarea>

                <label for="patientAllergies">
                    Allergies
                </label>

                <textarea
                    id="patientAllergies"
                    rows="3"
                    placeholder="Enter known allergies, if any"
                ></textarea>

                <button type="submit">
                    Add Patient
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    onclick="location.href='dashboard.html'">

                    Cancel

                </button>

            </form>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
